name: Publish package to npm registry

# Tag vX.Y.Z publishes to "latest"; vX.Y.Z-anything (e.g. v0.2.0-staging.1) to "staging".
# Uses npm trusted publishing (configure it for this repo on npmjs.com).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then TAG=staging; else TAG=latest; fi
          npm publish --access public --provenance --tag "$TAG"
